overview: |
  Python is the primary language (TypeScript/SolidJS for frontend).
  All projects share the same architectural skeleton and design
  principles. Code is self-documenting through types and naming.

project_structure: |
  PEP 517/621 compliant. src layout (src/pkg/) to prevent implicit
  imports of uninstalled code. pyproject.toml as the single source
  of project metadata. uv for dependency management.

  A project splits into four concerns, each a top-level package:
  - base/: project-agnostic infrastructure (config loading, DI
    container, shared services like LLM clients). This is the
    shared kernel — portable across projects with minimal changes.
  - modules/: domain logic. Each module is a self-contained unit
    with its own models, storage, and sources. Modules never
    import from each other.
  - cli/: thin adapter that parses arguments and delegates to
    modules. No business logic lives here.
  - server/: another thin adapter exposing modules via MCP or API.
    Mirrors the module structure (server/paper/, server/corpus/).

  This is essentially ports-and-adapters: domain at the center,
  cli and server as presentation adapters, base as infrastructure.

module_design: |
  A module owns a vertical slice of the domain. Split a new module
  when the domain concept has its own data, its own lifecycle, and
  could be removed without breaking other modules.

  Inside a module: common/ (models, factories), store/ (persistence),
  sources/ (external data ingestion), and feature-specific dirs.
  The common/ subpackage exports the module's public API via __all__.
  Factory functions (create_*) in common/ wire up internal components.

  Prefer one class per file. Utility functions at module level.
  Private helpers prefixed with underscore.

dependency_management: |
  Explicit dependency injection via punq container, not global state.
  An ApplicationContext wraps the container and tracks lifecycle
  (closeable resources). Register at startup, resolve by type.

  Use late imports inside factory/registration functions to break
  circular dependencies. Configuration flows from YAML files in
  configs/, loaded by a shared ConfigService with dot-notation
  access and environment variable fallback.

data_layer: |
  Embedded storage by default — SQLite for structured data, FTS5
  for search. No external database dependencies unless the problem
  demands it. Repository pattern abstracts storage access behind
  a clean interface.

  Dataclasses for internal records and DTOs. Pydantic only at
  system boundaries (API request validation, external config
  schemas). This keeps internal code lightweight and avoids
  validation overhead where trust is already established.

style: |
  Full type hints on all signatures. Modern syntax: pipe unions
  (X | None), lowercase generics (list[T], dict[K, V]).

  Types and names are the documentation. No docstrings unless
  public API. No comments unless the logic is genuinely non-obvious.

  Composition over inheritance. Pluggable behavior through strategy
  objects, factory functions, and registries — not class hierarchies.
  New variants are added by registering in a dict, not by modifying
  existing code.

  Error handling only at system boundaries and pipeline orchestration
  level. Internal functions trust their callers. Don't write code to
  handle situations that can't arise.

  Prefer flat over nested, concrete over generic. Don't abstract
  until the third use. Three similar lines is better than a premature
  helper.
